[project]
name = "netutils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "httpx>=0.27", "pytest>=8"]
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
